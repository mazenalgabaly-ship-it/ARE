<script>
/* =========================================================
   صيدلية الجبلي — نظام التأمينات الصحية المتكامل
   الملف الواحد: Auth + Cloud DB + OCR + Invoices + Reports
   ========================================================= */

/* ---------- 1) طبقة البيانات: Supabase حقيقي أو Local fallback ---------- */
const CLOUD = { url:'', anonKey:'' }; // ← ضع رابط Supabase ومفتاح anon هنا لتفعيل المزامنة السحابية الحقيقية
let sb = null;
if (CLOUD.url && CLOUD.anonKey) { try { sb = window.supabase.createClient(CLOUD.url, CLOUD.anonKey); } catch(e){ console.warn('Supabase init failed', e); } }

const LS = {
  get:(k,d)=>{ try{ const v=localStorage.getItem('gaby_'+k); return v?JSON.parse(v):d }catch(e){return d} },
  set:(k,v)=>localStorage.setItem('gaby_'+k, JSON.stringify(v))
};

// SQL مخطط قاعدة البيانات (شغّله في Supabase SQL Editor عند التفعيل)
const SCHEMA_SQL = `
create table if not exists profiles(id uuid primary key references auth.users on delete cascade,
  username text, pharmacy jsonb default '{}'::jsonb, settings jsonb default '{}'::jsonb, updated_at timestamptz default now());
create table if not exists invoices(id uuid primary key default gen_random_uuid(), owner uuid references auth.users on delete cascade,
  number text, company text, patient_name text, card_no text, ticket_no text, approval_no text, phone text, national_id text,
  invoice_date date, items jsonb default '[]'::jsonb, totals jsonb default '{}'::jsonb, status text default 'pending',
  monthly boolean default false, created_at timestamptz default now(), updated_at timestamptz default now());
create table if not exists treatments(id uuid primary key default gen_random_uuid(), owner uuid references auth.users on delete cascade,
  patient_name text, company text, card_no text, items jsonb default '[]'::jsonb, next_due date, active boolean default true, created_at timestamptz default now());
alter table invoices enable row level security; alter table treatments enable row level security; alter table profiles enable row level security;
create policy "own invoices" on invoices for all using (auth.uid() = owner) with check (auth.uid() = owner);
create policy "own treatments" on treatments for all using (auth.uid() = owner) with check (auth.uid() = owner);
create policy "own profile" on profiles for all using (auth.uid() = id) with check (auth.uid() = id);`;

const Store = {
  mode: sb ? 'cloud' : 'local',
  async list(table){
    if (sb) { const {data,error}=await sb.from(table).select('*').order('created_at',{ascending:false}); if(error) throw error; return data||[] }
    return LS.get(table, []);
  },
  async upsert(table,row){
    if (sb) { const {data,error}=await sb.from(table).upsert(row).select().single(); if(error) throw error; return data }
    const arr = LS.get(table,[]); const i = arr.findIndex(r=>r.id===row.id);
    if(i>=0) arr[i]={...arr[i],...row,updated_at:new Date().toISOString()}; else arr.unshift({...row,created_at:new Date().toISOString(),updated_at:new Date().toISOString()});
    LS.set(table,arr); return row;
  },
  async remove(table,id){
    if (sb) { const {error}=await sb.from(table).delete().eq('id',id); if(error) throw error; return }
    LS.set(table, LS.get(table,[]).filter(r=>r.id!==id));
  }
};

/* ---------- 2) المصادقة ---------- */
const Auth = {
  user: LS.get('session', null),
  async signUp({email,password,username}){
    if (sb) { const {data,error}=await sb.auth.signUp({email,password,options:{data:{username}}}); if(error) throw error; return data }
    const users = LS.get('users',[]);
    if(users.find(u=>u.email===email)) throw new Error('هذا البريد مسجّل بالفعل');
    const u = {id:crypto.randomUUID(), email, password:btoa(password), username};
    users.push(u); LS.set('users',users); this.user=u; LS.set('session',u); return u;
  },
  async signIn({email,password}){
    if (sb) { const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error) throw new Error('بيانات الدخول غير صحيحة'); this.user={id:data.user.id,email:data.user.email,username:data.user.user_metadata?.username}; LS.set('session',this.user); return this.user }
    const u = LS.get('users',[]).find(x=>x.email===email && x.password===btoa(password));
    if(!u) throw new Error('بيانات الدخول غير صحيحة');
    this.user=u; LS.set('session',u); return u;
  },
  async changePassword(oldP,newP){
    if(sb){ const {error}=await sb.auth.updateUser({password:newP}); if(error) throw error; toast('تم تغيير كلمة المرور','success'); return }
    const users=LS.get('users',[]); const u=users.find(x=>x.id===this.user.id);
    if(u.password!==btoa(oldP)) throw new Error('كلمة المرور الحالية غير صحيحة');
    u.password=btoa(newP); LS.set('users',users); toast('تم تغيير كلمة المرور','success');
  },
  signOut(){ this.user=null; localStorage.removeItem('gaby_session'); renderLogin(); }
};

/* ---------- 3) أدوات عامة ---------- */
const fmt = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const EGP = n => fmt.format(+n||0)+' ج.م';
const todayISO = ()=> new Date().toISOString().slice(0,10);
const uid = ()=> crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2)+Date.now();
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const COMPANIES = [
  {id:'axa',name:'AXA',color:'#00953b'},
  {id:'metlife',name:'MetLife',color:'#00529c'},
  {id:'medright',name:'MedRight',color:'#e4002b'}
];
const cName = id => (COMPANIES.find(c=>c.id===id)||{}).name || id;
const cColor = id => (COMPANIES.find(c=>c.id===id)||{}).color || '#64748b';

function toast(msg,type='info'){
  const colors={success:'bg-emerald-600',error:'bg-red-600',info:'bg-slate-800'};
  const el=document.createElement('div');
  el.className=`${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg fade-in font-semibold text-sm flex items-center gap-2`;
  el.innerHTML=`<i data-lucide="${type==='success'?'check-circle':type==='error'?'alert-triangle':'info'}" style="width:16px;height:16px"></i>${msg}`;
  document.getElementById('toast-host').appendChild(el); lucide.createIcons();
  setTimeout(()=>{el.style.opacity='0';el.style.transition='.4s';setTimeout(()=>el.remove(),400)},3200);
}
function modal(html,onMount){
  const host=document.getElementById('modal-host');
  host.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="card w-full max-w-2xl p-6 fade-in max-h-[90vh] overflow-auto">${html}</div></div>`;
  lucide.createIcons(); if(onMount)onMount();
}
function closeModal(){ document.getElementById('modal-host').innerHTML='' }

/* ---------- 4) المحرك المالي ---------- */
// إجمالي الصنف = سعر الوحدة × عدد العلب (+ الأشرطة تُحسب ككمية إضافية إن كان لها سعر مستقل)
function itemTotal(it){
  const boxes=(+it.boxes||0)*(+it.price||0);
  const strips=(+it.strips||0)*(+(it.stripPrice||it.price)||0);
  return +(boxes+strips).toFixed(2);
}
function computeTotals(items,cfg={}){
  const gross=+items.reduce((s,i)=>s+itemTotal(i),0).toFixed(2);
  const discount=+cfg.discount||0, patientShare=+cfg.patientShare||0;
  const afterDiscount=+(gross-discount).toFixed(2);          // بعد الخصم فقط (لا خصم مزدوج)
  const companyDue=+(afterDiscount-patientShare).toFixed(2);  // المطلوب من الشركة
  const netProfit=+(companyDue-(+cfg.cost||0)).toFixed(2);    // صافي الربح = المستحق − التكلفة
  return {gross,discount,patientShare,afterDiscount,companyDue,netProfit};
}
// MedRight: "2-3" => يسار الشرطة علب / يمينها أشرطة
function parseQty(raw,isMR){
  if(raw==null||raw==='')return{boxes:'',strips:''};
  const s=String(raw).trim();
  if(isMR){ const m=s.match(/^(\d+)\s*[-\u2013\u2014]\s*(\d+)$/); if(m)return{boxes:+m[1],strips:+m[2]} }
  const n=parseInt(s.replace(/[^\d]/g,''),10);
  return isNaN(n)?{boxes:'',strips:''}:{boxes:n,strips:''};
}

/* ---------- 5) محرك OCR لكل شركة ---------- */
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function fileToText(file,onProgress){
  if(file.type==='application/pdf'){
    const pdf=await pdfjsLib.getDocument(await file.arrayBuffer()).promise; let out='';
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p); const vp=page.getViewport({scale:2});
      const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      const {data}=await Tesseract.recognize(cv,'ara+eng',{logger:m=>{if(m.status==='recognizing text'&&onProgress)onProgress(Math.round(((p-1+m.progress)/pdf.numPages)*100))}});
      out+=data.text+'\n';
    }
    return out;
  }
  const {data}=await Tesseract.recognize(file,'ara+eng',{logger:m=>{if(m.status==='recognizing text'&&onProgress)onProgress(Math.round(m.progress*100))}});
  return data.text;
}

  axa:{ card:/car(?:d|ne|nih)\D{0,8}
